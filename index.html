<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20/10 mini gift</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="landscape" class="d-none">
    <img class="img" alt="bodoquyenluc" src="./media/img/bo-doi-quyen-luc.jpg" />
  </div>
    <div id="card" class="card">
        <div class="outside">
          <div class="front">
            <p>20/10</p>
            <div class="flower-card">
              <img src="./media/img/card.jpg" alt="" class="img">
            </div>
          </div>
          <div class="back"></div>
        </div>
        <div class="inside">
          <p>Happy Vietnamese Woman Day! Wish you passing this course!</p>
          <button class="confetti">Click me &#127881</button>
        </div>
      </div>
    <!-- <embed name="myMusic" src="./media/audio/ceremony.mp3" type="audio/midi" autostart="true" Hidden="true" loop="true"></embed>  -->
    <audio id="song" loop>
      <source src="./media/audio/ceremony.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
   
  
    <script src="./script.js"></script>
    <script>
      window.addEventListener('click', () => {
        document.getElementById('song').play();
        document.getElementById('song').loop();
      })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</body>
</html>
